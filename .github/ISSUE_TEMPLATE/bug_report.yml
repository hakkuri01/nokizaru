name: Bug report
description: Report a reproducible problem in Nokizaru
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Keep details reproducible and redact secrets/private target data.
  - type: input
    id: version
    attributes:
      label: Nokizaru version
      placeholder: e.g. 2.4.11
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Installation / runtime
      description: For Nix, include the system architecture; for source installs, include the Ruby version.
      placeholder: e.g. Nix aarch64-linux or ruby 4.0.5
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / distro
      placeholder: e.g. Arch
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command used (redacted)
      placeholder: nokizaru --sub --target https://example.com -T 10
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output/logs (redacted)
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I redacted secrets and private target data.
          required: true
